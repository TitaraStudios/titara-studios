      <stop offset="0" stop-color="#3A1640" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="h" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FB3" /><stop offset="1" stop-color="#FF3D77" />
