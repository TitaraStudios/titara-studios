  </defs>
  <rect width="960" height="540" fill="url(#bg)" />
  <text x="480" y="90" font-family="Space Grotesk, sans-serif" font-size="28" font-weight="700" fill="#FFD93D" text-anchor="middle">DAILY CHALLENGE</text>
