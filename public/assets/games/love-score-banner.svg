<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1533" />
      <stop offset="1" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8FB3" />
      <stop offset="1" stop-color="#FF3D77" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FF6B9D" stop-opacity="0.55" />
      <stop offset="1" stop-color="#FF6B9D" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky)" />
  <circle cx="400" cy="220" r="230" fill="url(#glow)" />

  <!-- floating hearts -->
  <g fill="url(#heart)">
    <path d="M400 150 c-30 -46 -110 -30 -110 26 c0 46 72 84 110 118 c38 -34 110 -72 110 -118 c0 -56 -80 -72 -110 -26 Z" />
  </g>
  <g fill="#FFD93D" opacity="0.9">
    <path d="M180 120 c-12 -18 -44 -12 -44 10 c0 18 30 34 44 48 c14 -14 44 -30 44 -48 c0 -22 -32 -28 -44 -10 Z" />
  </g>
  <g fill="#00D2FF" opacity="0.85">
    <path d="M640 300 c-10 -15 -37 -10 -37 8 c0 15 25 28 37 40 c12 -12 37 -25 37 -40 c0 -18 -27 -23 -37 -8 Z" />
  </g>

  <!-- score meter -->
  <rect x="250" y="330" width="300" height="26" rx="13" fill="#fff" opacity="0.15" />
  <rect x="250" y="330" width="234" height="26" rx="13" fill="url(#heart)" />
  <text x="400" y="404" font-family="Space Grotesk, sans-serif" font-size="44" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">LOVE SCORE</text>
  <text x="400" y="440" font-family="Inter, sans-serif" font-size="20" fill="#FF9FBF" text-anchor="middle">Match. Score. Celebrate.</text>
</svg>
